<!DOCTYPE html>
<html>
<head>
    <title>DOM Click Event</title>
</head>
<body>

    <h1 id="heading">Welcome</h1>

    <button onclick="changeText()">Change text</button>

    <script>
        function changeText() {
            document.getElementById("heading").textContent = "Button clicked";
        }
    </script>

</body>
</html>
